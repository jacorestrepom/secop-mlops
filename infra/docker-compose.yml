# Plan B de la demo: la API con una copia local de la publicación vigente (PostgreSQL), sin AWS.
# El volcado lo trae infra/cargar_demo.sh a infra/demo/serving.sql.gz (no va a Git) y PostgreSQL lo carga solo
# al crear su volumen. Uso (desde la raíz del repo):  ./infra/cargar_demo.sh
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: secop
    volumes:
      - ./demo/serving.sql.gz:/docker-entrypoint-initdb.d/serving.sql.gz:ro
      - datos-demo:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d secop"]
      interval: 3s
      timeout: 3s
      retries: 60
    ports:
      - "55433:5432"

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    image: secop-api:local
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      FUENTE_DATOS: rds
      DATABASE_URL: postgresql://postgres:demo@postgres:5432/secop?sslmode=disable
      CORS_ORIGINS: http://localhost:5173

volumes:
  datos-demo:
